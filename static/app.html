<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3182F6" />
  <meta name="description" content="AI 마음 웰니스 · 자기성찰 — 마음쉼터 (비의료)" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icons/icon.svg" />
  <title>마음쉼터</title>
  <link rel="stylesheet" href="/static/css/toss-ui.css" />
  <style>
    :root {
      --app-header-h: 48px;
      --app-tabs-h: 46px;
      --app-safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body.app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      max-width: 960px;
      margin: 0 auto;
      background: var(--t-bg, #f2f4f6);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      padding-bottom: var(--app-safe-bottom);
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .app-header {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; min-height: var(--app-header-h);
      background: #fff; border-bottom: 1px solid #e5e8eb;
      z-index: 20;
      position: relative;
    }
    .app-header h1 { margin: 0; font-size: 1.02rem; font-weight: 800; letter-spacing: -0.03em; }
    .scope-badge {
      font-size: 0.6rem; font-weight: 700; padding: 4px 8px; border-radius: 999px;
      background: #eef3ff; color: #1a56db;
    }
    .app-tabs {
      flex: 0 0 auto;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
      min-height: var(--app-tabs-h);
      background: #fff; border-bottom: 1px solid #e5e8eb;
      z-index: 20;
      position: relative;
    }
    .app-tabs button {
      border: none; background: transparent; padding: 10px 2px;
      font: inherit; font-size: 0.66rem; font-weight: 600; color: #8b95a1;
      cursor: pointer; border-bottom: 2px solid transparent;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .app-tabs button.active { color: #3182f6; border-bottom-color: #3182f6; }
    .organism-bar {
      flex: 0 0 auto;
      background: linear-gradient(180deg, #fff 0%, #f8fafc 100%);
      border-bottom: 1px solid #e5e8eb;
      padding: 6px 10px;
      z-index: 15;
      position: relative;
    }
    .organism-nodes {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      max-width: 520px; margin: 0 auto;
    }
    .organism-wire {
      flex: 1; max-width: 18px; height: 2px;
      background: linear-gradient(90deg, #c5d5f5, #a8e6cf);
      opacity: 0.55; border-radius: 2px;
    }
    .organism-node {
      width: 38px; height: 38px; border-radius: 12px; border: 2px solid #e5e8eb;
      background: #fff; cursor: pointer; display: grid; place-items: center;
      transform: scale(calc(0.9 + var(--pulse, 0.2) * 0.1));
      box-shadow: 0 0 0 calc(var(--pulse, 0.15) * 5px) rgba(49, 130, 246, 0.12);
      flex: 0 0 auto;
      touch-action: manipulation;
    }
    .organism-node.active { border-color: #3182f6; }
    .organism-node.linked { border-color: #2d6a4f; }
    .organism-emoji { font-size: 1.1rem; line-height: 1; }
    .organism-actions { display: none; }
    .app-main {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      background: #fff;
      overflow: hidden;
      z-index: 1;
    }
    .app-frame {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0;
      display: none;
      background: #fff;
      /* critical: inactive frames must not steal touches */
      pointer-events: none;
    }
    .app-frame.active {
      display: block;
      pointer-events: auto;
    }
    .app-footer {
      flex: 0 0 auto;
      padding: 6px 12px 8px; font-size: 0.6rem; color: #6b7684; line-height: 1.4;
      background: #fff; border-top: 1px solid #e5e8eb; text-align: center;
      z-index: 15;
      position: relative;
    }
    .app-footer a { color: #3182f6; text-decoration: none; margin: 0 4px; }
    .crisis-line { font-weight: 700; color: #d14343; margin-bottom: 2px; }
    @media (max-width: 720px) {
      .organism-bar { display: none; } /* free space + avoid touch confusion */
      .app-footer { display: none; }
      .app-header { min-height: 42px; }
      .app-header h1 { font-size: 0.92rem; }
      .app-tabs button { font-size: 0.6rem; padding: 9px 1px; }
    }
    .consent-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000;
      display: grid; place-items: center; padding: 16px;
      pointer-events: auto;
    }
    .consent-overlay[hidden] {
      display: none !important;
      pointer-events: none !important;
    }
    .consent-card {
      max-width: 420px; width: 100%; background: #fff; border-radius: 16px;
      padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      max-height: min(80vh, 560px); overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .consent-card h2 { margin: 0 0 8px; font-size: 1.05rem; }
    .consent-card p { margin: 0 0 10px; font-size: 0.82rem; color: #4e5968; line-height: 1.55; }
    .consent-card ul { margin: 0 0 14px; padding-left: 18px; font-size: 0.78rem; color: #4e5968; line-height: 1.5; }
    .consent-actions { display: flex; gap: 8px; }
    .consent-actions button {
      flex: 1; border: none; border-radius: 10px; padding: 14px 12px; font: inherit;
      font-weight: 700; cursor: pointer; touch-action: manipulation;
    }
    .consent-actions .primary { background: #3182f6; color: #fff; }
    .consent-actions .secondary { background: #f2f4f6; color: #4e5968; }
  </style>
</head>
<body class="app-shell toss-ui">
  <div class="consent-overlay" id="consentOverlay" hidden>
    <div class="consent-card" role="dialog" aria-labelledby="consentTitle">
      <h2 id="consentTitle">서비스 이용 안내</h2>
      <p id="consentSummary">불러오는 중…</p>
      <ul id="consentList"></ul>
      <div class="consent-actions">
        <button type="button" class="secondary" id="consentDetail">자세히 보기</button>
        <button type="button" class="primary" id="consentAccept">이해했어요 · 시작</button>
      </div>
    </div>
  </div>

  <header class="app-header">
    <h1>마음쉼터</h1>
    <span class="scope-badge">AI 웰니스 · 비의료</span>
  </header>

  <nav class="app-tabs" aria-label="앱 메뉴">
    <button type="button" data-tab="tarot" id="tabTarot">타로</button>
    <button type="button" data-tab="checkin" id="tabCheckin">오늘 마음</button>
    <button type="button" data-tab="chat" class="active" id="tabChat">AI 대화</button>
    <button type="button" data-tab="clinical" id="tabClinical">마음 돌보기</button>
    <button type="button" data-tab="props" id="tabProps">소품게임</button>
  </nav>

  <div class="organism-bar" id="organismBar" aria-label="마음 기능 연결"></div>

  <main class="app-main">
    <!-- src is set lazily — loading 5 heavy iframes freezes phones -->
    <iframe class="app-frame" id="frameTarot" title="타로 자기성찰" data-src="/tarot?embed=1" src="about:blank"></iframe>
    <iframe class="app-frame" id="frameCheckin" title="오늘 마음 체크인" data-src="/home?embed=1" src="about:blank"></iframe>
    <iframe class="app-frame" id="frameChat" title="AI 마음 대화" data-src="/chat?embed=1" src="about:blank"></iframe>
    <iframe class="app-frame" id="frameClinical" title="마음 돌보기" data-src="/clinical?embed=1" src="about:blank"></iframe>
    <iframe class="app-frame" id="frameProps" title="소품 게임" data-src="/stealth-props?embed=1" src="about:blank"></iframe>
  </main>

  <footer class="app-footer">
    <div class="crisis-line">위기 시 1393 · 119 · 129 · 1577-0199</div>
    <div>
      AI 웰니스·자기성찰 도구 (의료·정신과 진료·응급 아님) ·
      <a href="/legal#terms">이용약관</a>
      <a href="/legal#privacy">개인정보</a>
      <a href="/legal#disclaimer">면책</a>
    </div>
  </footer>

  <script src="/static/js/maum-organism.js"></script>
  <script>
    const CONSENT_KEY = "psychology_ai_consent_v1";
    const DEFAULT_TAB = "chat";
    const organismBar = document.getElementById("organismBar");
    const frames = {
      tarot: document.getElementById("frameTarot"),
      checkin: document.getElementById("frameCheckin"),
      chat: document.getElementById("frameChat"),
      clinical: document.getElementById("frameClinical"),
      props: document.getElementById("frameProps"),
    };
    const tabs = document.querySelectorAll(".app-tabs button");

    function ensureFrameSrc(frame) {
      if (!frame || frame.dataset.loaded === "1") return;
      const src = frame.getAttribute("data-src");
      if (!src) return;
      frame.src = src;
      frame.dataset.loaded = "1";
    }

    function switchTab(name) {
      if (!frames[name]) name = DEFAULT_TAB;
      tabs.forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === name));
      Object.entries(frames).forEach(([key, frame]) => {
        const active = key === name;
        frame.classList.toggle("active", active);
        frame.style.pointerEvents = active ? "auto" : "none";
        frame.setAttribute("aria-hidden", active ? "false" : "true");
        if (active) ensureFrameSrc(frame);
      });
      try { location.hash = name; } catch (_) {}
    }

    let lastTabAt = 0;
    function onTabPress(name) {
      const now = Date.now();
      if (now - lastTabAt < 350) return;
      lastTabAt = now;
      switchTab(name);
    }
    tabs.forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        onTabPress(btn.dataset.tab);
      });
    });

    const hash = (location.hash || `#${DEFAULT_TAB}`).replace("#", "");
    const tab = hash === "picto" ? "checkin" : hash;
    switchTab(frames[tab] ? tab : DEFAULT_TAB);

    async function loadConsent() {
      if (localStorage.getItem(CONSENT_KEY) === "1") return;
      const overlay = document.getElementById("consentOverlay");
      try {
        const res = await fetch("/api/v1/legal/consent");
        const data = await res.json();
        document.getElementById("consentSummary").textContent = data.summary || "";
        document.getElementById("consentList").innerHTML = (data.acknowledgments || [])
          .map((item) => `<li>${item}</li>`).join("");
      } catch (_) {
        document.getElementById("consentSummary").textContent =
          "마음쉼터는 AI 웰니스·자기성찰 도구이며, 의료·정신과 진료·응급 서비스가 아닙니다.";
      }
      overlay.hidden = false;
    }

    document.getElementById("consentAccept").addEventListener("click", () => {
      localStorage.setItem(CONSENT_KEY, "1");
      document.getElementById("consentOverlay").hidden = true;
    });
    document.getElementById("consentDetail").addEventListener("click", () => {
      window.open("/legal", "_blank");
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/sw.js").catch(() => {});
    }
    loadConsent();
    // Defer organism fetch so first paint / first iframe stay responsive on phones
    setTimeout(() => { try { refreshOrganism(); } catch (_) {} }, 800);
    window.addEventListener("message", (event) => {
      if (event.data?.type === "maum-organism-refresh") refreshOrganism();
      const next = event.data?.tab;
      if (event.data?.type !== "maum-nav" || !frames[next]) return;
      switchTab(next);
      if (next === "chat" && event.data.from_tarot) {
        const send = () => frames.chat.contentWindow?.postMessage({ type: "maum-tarot-handoff" }, "*");
        if (frames.chat.dataset.loaded === "1") setTimeout(send, 300);
        else frames.chat.addEventListener("load", () => setTimeout(send, 200), { once: true });
      }
    });

    async function refreshOrganism() {
      if (!window.MaumOrganism || !organismBar) return;
      try {
        const state = await MaumOrganism.fetchState();
        MaumOrganism.renderWeb(organismBar, state);
      } catch (_) {}
    }
  </script>
</body>
</html>
