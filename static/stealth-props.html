<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1412" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="11장의 소품 카드로 가볍게 마음 놀이하기" />
  <title>마음쉼터 · 소품 카드 놀이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/embed.css" />
  <script src="/static/js/embed-bridge.js"></script>
  <style>
    :root {
      --bg0: #0c1412;
      --bg1: #15221c;
      --ink: #e8f0ea;
      --muted: #8aa396;
      --gold: #c9a227;
      --gold-soft: rgba(201, 162, 39, 0.22);
      --emerald: #2dd4a8;
      --line: rgba(201, 162, 39, 0.28);
      --surface: rgba(21, 34, 28, 0.92);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-display: "Cormorant Garamond", serif;
      --font-body: "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(45, 212, 168, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(201, 162, 39, 0.12), transparent),
        linear-gradient(165deg, var(--bg0), var(--bg1));
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    html.embed-mode body {
      height: 100%;
      max-height: 100%;
    }
    main {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
    }
    .top {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      background: rgba(8, 14, 12, 0.72); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 20;
    }
    .top h1 {
      margin: 0; flex: 1; font-family: var(--font-display);
      font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em;
    }
    .top a, .top button {
      color: var(--gold); background: transparent; border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px; text-decoration: none; font-size: 0.78rem;
      cursor: pointer; font-family: inherit;
    }
    .state-strip {
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
      margin: 12px 16px 0; padding: 12px 14px; border-radius: 16px;
      background: rgba(0,0,0,0.28); border: 1px solid var(--line);
    }
    .state-orb {
      width: 52px; height: 52px; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff8, var(--emerald) 45%, #0a3 90%);
      box-shadow: 0 0 24px rgba(45,212,168,0.35);
      display: grid; place-items: center; font-size: 1.35rem;
      transition: transform 0.45s var(--ease), filter 0.45s;
    }
    .state-orb.final { filter: saturate(1.25); box-shadow: 0 0 28px rgba(201,162,39,0.45); }
    .state-copy strong { display: block; font-size: 0.92rem; margin-bottom: 2px; }
    .state-copy span { font-size: 0.72rem; color: var(--muted); line-height: 1.4; }
    .state-meter { width: 72px; text-align: right; }
    .state-meter b { display: block; color: var(--gold); font-size: 1.05rem; }
    .state-meter small { color: var(--muted); font-size: 0.65rem; }
    .progress-wrap { padding: 10px 16px; }
    .bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--emerald), var(--gold)); transition: width .35s var(--ease); }
    .progress-meta { margin-top: 6px; font-size: 0.72rem; color: var(--muted); display: flex; justify-content: space-between; }
    main { flex: 1; max-width: 920px; margin: 0 auto; width: 100%; padding: 8px 16px 100px; }
    .intro-head { text-align: center; margin: 8px 0 18px; }
    .intro-head .eyebrow { color: var(--gold); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 6px; }
    .intro-head h2 {
      margin: 0 0 8px; font-family: var(--font-display); font-size: clamp(1.45rem, 4vw, 2rem);
      font-weight: 600; line-height: 1.25;
    }
    .intro-head p { margin: 0 auto; max-width: 36rem; color: var(--muted); font-size: 0.88rem; line-height: 1.55; }

    /* Tarot-like prop deck */
    .prop-deck {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 12px;
      perspective: 900px;
    }
    .prop-card {
      position: relative; aspect-ratio: 2 / 3.15; border: none; padding: 0;
      background: transparent; cursor: pointer; font: inherit; color: inherit;
      transform-style: preserve-3d; transition: transform 0.35s var(--ease);
    }
    .prop-card:hover:not(:disabled):not(.done) { transform: translateY(-6px) rotateX(4deg); }
    .prop-card:disabled { cursor: default; opacity: 0.55; }
    .prop-card.done { cursor: default; }
    .prop-face {
      position: absolute; inset: 0; border-radius: 14px;
      backface-visibility: hidden; overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 14px 28px rgba(0,0,0,0.35);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 12px 10px 14px; text-align: center;
    }
    .prop-back {
      background:
        radial-gradient(circle at 50% 30%, rgba(45,212,168,0.25), transparent 55%),
        linear-gradient(160deg, #1a2c24, #0e1814 60%, #1c2818);
    }
    .prop-back::before {
      content: ""; position: absolute; inset: 8px; border-radius: 10px;
      border: 1px solid rgba(201,162,39,0.35);
      background:
        repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(201,162,39,0.05) 6px, rgba(201,162,39,0.05) 7px);
    }
    .prop-symbol {
      position: relative; z-index: 1; font-size: 1.85rem; margin-bottom: 10px;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35));
      animation: floatSymbol 3.6s ease-in-out infinite;
    }
    .prop-card:nth-child(2n) .prop-symbol { animation-delay: 0.4s; }
    .prop-card:nth-child(3n) .prop-symbol { animation-delay: 0.8s; }
    @keyframes floatSymbol {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .prop-name {
      position: relative; z-index: 1; font-family: var(--font-display);
      font-size: 0.95rem; font-weight: 600; line-height: 1.2; margin: 0 0 4px;
    }
    .prop-cue {
      position: relative; z-index: 1; font-size: 0.62rem; color: var(--muted);
      line-height: 1.35; margin: 0; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .prop-badge {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      font-size: 0.6rem; letter-spacing: 0.08em; color: var(--gold);
      border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px;
      background: rgba(0,0,0,0.35);
    }
    .prop-card.done .prop-face {
      border-color: rgba(45,212,168,0.55);
      box-shadow: 0 0 0 1px rgba(45,212,168,0.25), 0 14px 28px rgba(0,0,0,0.3);
    }
    .prop-card.done .prop-badge { color: var(--emerald); border-color: rgba(45,212,168,0.5); }
    .prop-card.active .prop-face {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201,162,39,0.35), 0 18px 36px rgba(0,0,0,0.4);
    }
    .deck-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 18px 0 8px; }
    .btn {
      border: none; border-radius: 12px; padding: 12px 16px; font-weight: 700;
      cursor: pointer; font-size: 0.85rem; font-family: inherit;
    }
    .btn-primary { background: linear-gradient(135deg, var(--emerald), #1aa882); color: #062018; }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .stage {
      display: none;
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
      padding: 18px; min-height: 360px; margin-top: 8px;
    }
    .stage.open { display: block; animation: riseIn 0.4s var(--ease); }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .stage .eyebrow { color: var(--gold); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 8px; }
    .stage h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 1.4rem; line-height: 1.3; }
    .stage p { margin: 0 0 14px; color: var(--muted); font-size: 0.88rem; line-height: 1.55; }
    .play-area {
      border: 1px dashed rgba(45, 212, 168, 0.35); border-radius: 14px;
      background: rgba(0,0,0,0.25); min-height: 160px; padding: 14px;
      position: relative; overflow: hidden; touch-action: none;
    }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 10px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .target {
      width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--emerald));
      position: absolute; left: 40%; top: 40%;
      box-shadow: 0 0 24px rgba(45,212,168,0.45); cursor: pointer;
    }
    .decoy {
      width: 36px; height: 36px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #aaa, #555);
      position: absolute; opacity: 0.55; cursor: pointer;
    }
    input[type=range] { width: 100%; accent-color: var(--gold); }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
    .stat {
      background: rgba(0,0,0,0.28); border-radius: 12px; padding: 10px 12px;
      border: 1px solid var(--line);
    }
    .stat b { display: block; font-size: 1.1rem; color: var(--gold); }
    .stat span { font-size: 0.68rem; color: var(--muted); }
    .persona {
      margin-top: 14px; padding: 14px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(45,212,168,0.12), rgba(201,162,39,0.12));
      border: 1px solid var(--line);
    }
    .persona h3 { margin: 0 0 6px; font-size: 1.05rem; font-family: var(--font-display); }
    .live-bars { display: grid; gap: 8px; margin-top: 12px; }
    .live-bar-row { display: grid; grid-template-columns: 88px 1fr 36px; gap: 8px; align-items: center; }
    .live-bar-row .lbl { font-size: 0.68rem; color: var(--muted); }
    .live-bar-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .live-bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--emerald), var(--gold)); width: 0%; transition: width 0.4s var(--ease); }
    .live-bar-row .val { font-size: 0.68rem; color: var(--gold); text-align: right; }
    .disclaimer {
      margin-top: 16px; font-size: 0.72rem; color: var(--muted); line-height: 1.45;
      border-top: 1px solid var(--line); padding-top: 12px;
    }
    .deck-panel.hidden, .stage:not(.open) { }
    .deck-panel.hidden { display: none; }
    @media (max-width: 520px) {
      .prop-deck { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .prop-name { font-size: 0.82rem; }
      .prop-cue { display: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a href="/home">← 홈</a>
    <h1>소품 카드 놀이</h1>
    <a href="/chat#status">내 상태</a>
    <a href="/chat#mind-network">3D 도면</a>
  </header>

  <section class="state-strip" aria-live="polite">
    <div class="state-orb" id="stateOrb">✦</div>
    <div class="state-copy">
      <strong id="stateTitle">끌리는 카드가 있으면, 하나만 골라 보세요</strong>
      <span id="stateSub">부담 없이요. 고르면 짧은 놀이가 열리고, 천천히 이어가도 충분해요.</span>
    </div>
    <div class="state-meter">
      <b id="stateCount">0/11</b>
      <small id="stateStatus">시작 전</small>
    </div>
  </section>

  <div class="progress-wrap">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="progress-meta">
      <span id="progressLabel">0 / 11</span>
      <span id="statusLabel">원하면 몇 장만 해도 괜찮아요</span>
    </div>
  </div>

  <main>
    <section class="deck-panel" id="deckPanel">
      <div class="intro-head">
        <p class="eyebrow">가벼운 카드 놀이</p>
        <h2>11장의 소품 카드</h2>
        <p>타로처럼 카드가 펼쳐져 있어요. 끌리는 걸 고르면 짧은 미니 게임이 열려요. 정답은 없고, 중간에 멈춰도 괜찮습니다.</p>
      </div>
      <div class="prop-deck" id="propDeck" role="list"></div>
      <div class="deck-actions">
        <button class="btn btn-primary" id="autoNextBtn">다음 미완료 카드</button>
        <button class="btn btn-ghost" id="resetBtn">처음부터</button>
        <button class="btn btn-ghost" id="resultBtn" hidden>결과 보기</button>
      </div>
    </section>

    <section class="stage" id="stage"></section>
    <p class="disclaimer">가벼운 자기성찰·웰니스 참고용이며 의료 진단을 대체하지 않습니다. 부담 없이 몇 장만 해도 괜찮아요.</p>
  </main>

  <script>
  (function () {
    const USER_KEY = "psychology_ai_user_id";
    const SESS_KEY = "stealth_prop_session";
    function uid() {
      let id = localStorage.getItem(USER_KEY) || localStorage.getItem("maum_user_id");
      if (!id) {
        id = "user-" + Math.random().toString(36).slice(2, 10);
      }
      localStorage.setItem(USER_KEY, id);
      return id;
    }
    function sid() {
      let id = sessionStorage.getItem(SESS_KEY);
      if (!id) {
        id = "sps-" + Date.now().toString(36);
        sessionStorage.setItem(SESS_KEY, id);
      }
      return id;
    }

    const PROPS = [
      { id: "RAIN_DROP", title: "물방울", cue: "빗방울 스트로보에 맞춰 점을 따라가세요.", kind: "chase", symbol: "💧" },
      { id: "WATER_TANK", title: "수조 탈출", cue: "신호가 뜨면 즉시 탈출 버튼을 누르세요.", kind: "qte", symbol: "🫧" },
      { id: "CARD_STEALTH", title: "레이저 카드", cue: "레이저 격자 사이로 카드를 미끄러뜨리세요.", kind: "slider", symbol: "🂠" },
      { id: "CHAMBER_BOX", title: "차원 상자", cue: "패턴을 반복하지 말고 새 순서로 상자를 여세요.", kind: "sequence", symbol: "📦" },
      { id: "MIRROR_SHADOW", title: "가짜 잔상", cue: "잔상을 쫓지 말고 가만히 관조하세요.", kind: "idle", symbol: "🪞" },
      { id: "ROULETTE_DIAL", title: "미스디렉션 루렛", cue: "미끼를 누르지 말고 진짜 눈을 고르세요.", kind: "bait", symbol: "🎯" },
      { id: "PERSONA_MASK", title: "페르소나 마스크", cue: "미세한 표정이 다른 마스크를 고르세요.", kind: "mask", symbol: "🎭" },
      { id: "SLEIGHT_PALMING", title: "손놀림", cue: "일정한 압력으로 원을 그리세요.", kind: "draw", symbol: "✋" },
      { id: "MENTAL_PRIMING", title: "멘탈 프라이밍", cue: "암시에 끌리지 말고 스스로 고르세요.", kind: "prime", symbol: "🧠" },
      { id: "HOLOGRAM_REALITY", title: "홀로그램", cue: "허상을 쫓지 말고 실체만 터치하세요.", kind: "holo", symbol: "✨" },
      { id: "INTERPERSONAL_SYNC", title: "인터랙션 동기화", cue: "상대 박자에 맞춰 탭하세요.", kind: "sync", symbol: "🤝" },
    ];

    const CLINICAL_LABELS = {
      ocdRigidityScore: "경직·반복",
      panicAnxietyIndex: "공황·긴장",
      asdStimmingRate: "자극 반복",
      cognitiveFlexibility: "유연성",
      dissociationScore: "거리감",
      impulsivityMisdirection: "충동",
      empathyTheoryOfMind: "공감",
      fineMotorControlIndex: "손 조절",
      hypnoticSuggestibility: "암시 수용",
      perceptualDefusionIndex: "현실 검증",
      interpersonalSynchrony: "동기화",
      personaIdentityFluidity: "페르소나",
    };

    const state = {
      index: 0,
      done: new Set(),
      lastReport: null,
      turn: 0,
      activeId: null,
    };

    const stage = document.getElementById("stage");
    const deckPanel = document.getElementById("deckPanel");
    const propDeck = document.getElementById("propDeck");
    const fill = document.getElementById("fill");
    const progressLabel = document.getElementById("progressLabel");
    const statusLabel = document.getElementById("statusLabel");
    const stateOrb = document.getElementById("stateOrb");
    const stateTitle = document.getElementById("stateTitle");
    const stateSub = document.getElementById("stateSub");
    const stateCount = document.getElementById("stateCount");
    const stateStatus = document.getElementById("stateStatus");
    const resultBtn = document.getElementById("resultBtn");

    function showDeck() {
      deckPanel.classList.remove("hidden");
      stage.classList.remove("open");
      stage.innerHTML = "";
      state.activeId = null;
      renderDeck();
    }

    function showStage() {
      deckPanel.classList.add("hidden");
      stage.classList.add("open");
    }

    function updateProgress(report) {
      const n = state.done.size;
      fill.style.width = (n / 11 * 100) + "%";
      progressLabel.textContent = n + " / 11";
      stateCount.textContent = n + "/11";
      let st = "시작 전";
      if (report && report.progress) {
        const p = report.progress;
        st = p.assessmentStatus === "final" ? "한 바퀴 모았어요" : "이어가는 중";
        statusLabel.textContent = st === "한 바퀴 모았어요"
          ? "충분해요 · 결과는 참고용이에요"
          : "원하면 " + (p.requiredForFinal || 8) + "장쯤까지 천천히";
      } else {
        statusLabel.textContent = "원하면 몇 장만 해도 괜찮아요";
      }
      stateStatus.textContent = st;
      stateOrb.classList.toggle("final", st === "한 바퀴 모았어요");
      if (report && report.title) {
        stateTitle.textContent = report.title;
        stateSub.textContent = report.awakening_quote || "카드가 남긴 결이 조금씩 모여요.";
        stateOrb.textContent = st === "한 바퀴 모았어요" ? "★" : "✦";
      } else if (n === 0) {
        stateTitle.textContent = "끌리는 카드가 있으면, 하나만 골라 보세요";
        stateSub.textContent = "부담 없이요. 고르면 짧은 놀이가 열리고, 천천히 이어가도 충분해요.";
        stateOrb.textContent = "✦";
      } else {
        stateTitle.textContent = n + "장을 만져 봤어요";
        stateSub.textContent = "더 하고 싶으면 이어서, 멈추고 싶으면 결과만 봐도 괜찮아요.";
      }
      resultBtn.hidden = n < 1;
      try {
        localStorage.setItem("maum_stealth_progress", JSON.stringify({
          done: n, status: st, title: report?.title || null, at: Date.now(),
        }));
      } catch (_) {}
    }

    async function ingest(payload, opts) {
      opts = opts || {};
      state.turn += 1;
      const forceReset = sessionStorage.getItem("stealth_force_reset") === "1";
      if (forceReset) sessionStorage.removeItem("stealth_force_reset");
      const body = {
        payloads: [payload],
        session_id: sid(),
        turn_index: state.turn,
        source: "prop_game",
        persist: true,
        resume_last: !(opts.reset || forceReset),
        reset: !!(opts.reset || forceReset),
      };
      const res = await fetch("/api/v1/users/" + encodeURIComponent(uid()) + "/stealth-unconscious/ingest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error("ingest failed " + res.status);
      const data = await res.json();
      state.lastReport = data;
      state.done.add(payload.prop);
      updateProgress(data);
      return data;
    }

    function ms() { return Date.now(); }

    function renderDeck() {
      propDeck.innerHTML = "";
      PROPS.forEach((p, idx) => {
        const done = state.done.has(p.id);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "prop-card" + (done ? " done" : "") + (state.activeId === p.id ? " active" : "");
        btn.setAttribute("role", "listitem");
        btn.innerHTML =
          '<div class="prop-face prop-back">' +
            '<span class="prop-badge">' + (done ? "완료" : String(idx + 1).padStart(2, "0")) + "</span>" +
            '<div class="prop-symbol">' + p.symbol + "</div>" +
            '<div class="prop-name">' + p.title + "</div>" +
            '<p class="prop-cue">' + p.cue + "</p>" +
          "</div>";
        if (!done) btn.onclick = () => openProp(p);
        propDeck.appendChild(btn);
      });
    }

    function openProp(prop) {
      state.activeId = prop.id;
      state.index = PROPS.findIndex((p) => p.id === prop.id);
      showStage();
      renderProp(prop);
    }

    function nextAfter(propId) {
      state.done.add(propId);
      const next = PROPS.find((p) => !state.done.has(p.id));
      if (!next) renderResult();
      else {
        showDeck();
        updateProgress(state.lastReport);
      }
    }

    function renderLiveBars(report) {
      const cli = (report && (report.clinical_profile || report.clinicalProfile)) || {};
      const keys = Object.keys(CLINICAL_LABELS).filter((k) => cli[k] != null).slice(0, 6);
      if (!keys.length) return "";
      return '<div class="live-bars">' + keys.map((k) => {
        const v = Math.round(Number(cli[k]) || 0);
        return '<div class="live-bar-row"><span class="lbl">' + CLINICAL_LABELS[k] +
          '</span><div class="live-bar-track"><div class="live-bar-fill" style="width:' + Math.min(100, v) +
          '%"></div></div><span class="val">' + v + "</span></div>";
      }).join("") + "</div>";
    }

    function renderProp(prop) {
      stage.innerHTML =
        '<p class="eyebrow">PROP ' + (state.index + 1) + " / 11 · " + prop.id + "</p>" +
        "<h2>" + prop.symbol + " " + prop.title + "</h2>" +
        "<p>" + prop.cue + "</p>" +
        '<div class="play-area" id="play"></div>' +
        '<p class="hint" id="hint">준비되면 시작하세요.</p>' +
        '<div class="actions"><button class="btn btn-primary" id="goBtn">시작</button>' +
        '<button class="btn btn-ghost" id="backDeckBtn">카드장으로</button>' +
        '<button class="btn btn-ghost" id="skipBtn">건너뛰기</button></div>';

      const play = document.getElementById("play");
      const hint = document.getElementById("hint");
      const goBtn = document.getElementById("goBtn");
      const skipBtn = document.getElementById("skipBtn");
      document.getElementById("backDeckBtn").onclick = showDeck;
      skipBtn.onclick = () => nextAfter(prop.id);

      const finish = async (payload) => {
        goBtn.disabled = true;
        skipBtn.disabled = true;
        hint.textContent = "지표 전송 중…";
        try {
          const report = await ingest(payload);
          hint.textContent = report.assessment_status === "final"
            ? "잘 모였어요 · 카드장으로"
            : "기록됐어요 · 카드장으로";
          setTimeout(() => nextAfter(prop.id), 450);
        } catch (e) {
          hint.textContent = "전송 실패. 다시 시도해 주세요.";
          goBtn.disabled = false;
          skipBtn.disabled = false;
        }
      };

      if (prop.kind === "chase") {
        goBtn.onclick = () => {
          hint.textContent = "움직이는 점을 누르세요.";
          const t = document.createElement("div");
          t.className = "target";
          play.appendChild(t);
          let hits = 0, misses = 0, sumDelta = 0;
          const move = () => {
            t.style.left = (10 + Math.random() * 70) + "%";
            t.style.top = (10 + Math.random() * 60) + "%";
          };
          move();
          const iv = setInterval(move, 700);
          t.onclick = (ev) => {
            hits += 1;
            const r = t.getBoundingClientRect();
            const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
            sumDelta += Math.hypot(ev.clientX - cx, ev.clientY - cy);
            if (hits >= 4) {
              clearInterval(iv);
              const avg = sumDelta / hits;
              finish({
                prop: prop.id, timestampMs: ms(),
                strobePrecisionDeltaPx: Math.min(20, avg / 4),
                tremorVector: { x: misses * 0.2, y: avg / 40 },
              });
            }
          };
          play.onclick = (ev) => { if (ev.target === play) misses += 1; };
        };
      } else if (prop.kind === "qte") {
        goBtn.onclick = () => {
          hint.textContent = "대기…";
          const delay = 600 + Math.random() * 1200;
          setTimeout(() => {
            hint.textContent = "지금!";
            const btn = document.createElement("button");
            btn.className = "btn btn-primary";
            btn.textContent = "탈출";
            btn.style.margin = "40px auto";
            btn.style.display = "block";
            play.appendChild(btn);
            const shown = performance.now();
            let stim = 0;
            play.onclick = (ev) => { if (ev.target === play) stim += 1; };
            btn.onclick = () => finish({
              prop: prop.id, timestampMs: ms(),
              qteLatencyMs: performance.now() - shown,
              panicStimmingCount: stim,
            });
          }, delay);
        };
      } else if (prop.kind === "slider") {
        play.innerHTML = '<label class="hint">궤적 정확도</label><input id="acc" type="range" min="0" max="100" value="70" />' +
          '<label class="hint">통과 속도 (낮을수록 빠름)</label><input id="lat" type="range" min="80" max="900" value="200" />';
        goBtn.textContent = "통과 확정";
        goBtn.onclick = () => finish({
          prop: prop.id, timestampMs: ms(),
          stealthPassLatencyMs: Number(document.getElementById("lat").value),
          trajectoryAccuracyRatio: Number(document.getElementById("acc").value) / 100,
        });
      } else if (prop.kind === "sequence") {
        const keys = ["A", "B", "C", "D"];
        let expected = keys.slice().sort(() => Math.random() - 0.5);
        let got = [];
        let repeats = 0;
        let last = "";
        play.innerHTML = keys.map((k) => '<button class="btn btn-ghost seq" data-k="' + k + '">' + k + "</button>").join(" ");
        const t0 = performance.now();
        goBtn.style.display = "none";
        hint.textContent = "순서: " + expected.join(" → ");
        play.querySelectorAll(".seq").forEach((b) => {
          b.onclick = () => {
            const k = b.getAttribute("data-k");
            if (k === last) repeats += 1;
            last = k;
            got.push(k);
            if (got.length === expected.length) {
              if (got.join() !== expected.join()) repeats += 2;
              finish({
                prop: prop.id, timestampMs: ms(),
                rigidPatternRepeatCount: repeats,
                dimensionReconstructTimeSec: (performance.now() - t0) / 1000,
              });
            }
          };
        });
      } else if (prop.kind === "idle") {
        goBtn.onclick = () => {
          hint.textContent = "잔상을 누르지 말고 3초간 관조…";
          let chasing = 0;
          const decoy = document.createElement("div");
          decoy.className = "decoy";
          decoy.style.left = "60%"; decoy.style.top = "30%";
          play.appendChild(decoy);
          decoy.onclick = () => { chasing += 1; };
          const t0 = performance.now();
          setTimeout(() => finish({
            prop: prop.id, timestampMs: ms(),
            illusionChasingClicks: chasing,
            idleAcceptanceDurationMs: performance.now() - t0,
          }), 3000);
        };
      } else if (prop.kind === "bait") {
        goBtn.onclick = () => {
          hint.textContent = "미끼(회색)를 피하고 에메랄드만";
          let bait = 0;
          for (let i = 0; i < 5; i++) {
            const d = document.createElement("div");
            const real = i === 2;
            d.className = real ? "target" : "decoy";
            d.style.left = (10 + i * 16) + "%";
            d.style.top = (20 + (i % 2) * 30) + "%";
            play.appendChild(d);
            d.onclick = () => {
              if (!real) { bait += 1; return; }
              finish({
                prop: prop.id, timestampMs: ms(),
                misdirectionBaitClicks: bait,
                entropyRandomnessIndex: Math.max(0.2, 1 - bait * 0.15),
              });
            };
          }
        };
      } else if (prop.kind === "mask") {
        goBtn.onclick = () => {
          const faces = ["🙂", "😐", "🙁", "😮"];
          const answer = Math.floor(Math.random() * faces.length);
          hint.textContent = "다른 표정을 고르세요 · 정답은 하나";
          play.innerHTML = faces.map((f, i) =>
            '<button class="btn btn-ghost" data-i="' + i + '" style="font-size:1.4rem;margin:4px">' + f + "</button>"
          ).join("");
          const t0 = performance.now();
          play.querySelectorAll("button").forEach((b) => {
            b.onclick = () => {
              const ok = Number(b.getAttribute("data-i")) === answer;
              finish({
                prop: prop.id, timestampMs: ms(),
                microExpressionScanLatencyMs: performance.now() - t0,
                maskMatchAccuracyRatio: ok ? 1 : 0.35,
              });
            };
          });
        };
      } else if (prop.kind === "draw") {
        goBtn.onclick = () => {
          hint.textContent = "원을 그리듯 드래그 (1.5초)";
          let pts = [], sum = 0;
          const onMove = (ev) => {
            const x = (ev.touches ? ev.touches[0].clientX : ev.clientX);
            const y = (ev.touches ? ev.touches[0].clientY : ev.clientY);
            if (pts.length) {
              const p = pts[pts.length - 1];
              sum += Math.hypot(x - p.x, y - p.y);
            }
            pts.push({ x, y });
          };
          play.addEventListener("pointermove", onMove);
          play.addEventListener("touchmove", onMove, { passive: true });
          setTimeout(() => {
            play.removeEventListener("pointermove", onMove);
            const varn = pts.length < 4 ? 0.8 : Math.min(1, sum / (pts.length * 40));
            finish({
              prop: prop.id, timestampMs: ms(),
              gestureCurvatureVariance: varn,
              touchPressureInstability: Math.min(1, pts.length / 80),
            });
          }, 1500);
        };
      } else if (prop.kind === "prime") {
        goBtn.onclick = () => {
          hint.textContent = "힌트에 끌리지 말고 고르세요";
          play.innerHTML =
            '<p class="hint" style="color:var(--gold)">힌트: 왼쪽이 정답처럼 느껴질 수 있어요</p>' +
            '<button class="btn btn-ghost" id="L">왼쪽</button> <button class="btn btn-ghost" id="R">오른쪽</button>';
          const t0 = performance.now();
          const pick = (biased) => finish({
            prop: prop.id, timestampMs: ms(),
            primingBiasAcceptanceRatio: biased ? 0.85 : 0.2,
            decisionHesitationMs: performance.now() - t0,
          });
          document.getElementById("L").onclick = () => pick(true);
          document.getElementById("R").onclick = () => pick(false);
        };
      } else if (prop.kind === "holo") {
        goBtn.onclick = () => {
          hint.textContent = "에메랄드 실체만 터치";
          let chase = 0;
          for (let i = 0; i < 4; i++) {
            const d = document.createElement("div");
            const real = i === 1;
            d.className = real ? "target" : "decoy";
            d.style.left = (15 + i * 18) + "%";
            d.style.top = "40%";
            play.appendChild(d);
            d.onclick = () => {
              if (!real) { chase += 1; return; }
              finish({
                prop: prop.id, timestampMs: ms(),
                distortionIllusionChasingClicks: chase,
                perceptualRealityTestingScore: Math.max(10, 95 - chase * 12),
              });
            };
          }
        };
      } else if (prop.kind === "sync") {
        goBtn.onclick = () => {
          hint.textContent = "박자에 맞춰 탭 (3회)";
          let beat = 0, deltas = [], last = performance.now();
          const iv = setInterval(() => {
            play.style.boxShadow = "inset 0 0 40px rgba(201,162,39,0.35)";
            setTimeout(() => { play.style.boxShadow = "none"; }, 120);
            last = performance.now();
          }, 650);
          play.onclick = () => {
            deltas.push(Math.abs(performance.now() - last));
            beat += 1;
            if (beat >= 3) {
              clearInterval(iv);
              const avg = deltas.reduce((a, b) => a + b, 0) / deltas.length;
              finish({
                prop: prop.id, timestampMs: ms(),
                interpersonalSyncDeltaMs: avg,
                socialAdaptabilityRatio: Math.max(0.2, Math.min(1, 1 - avg / 400)),
              });
            }
          };
        };
      }
    }

    function renderResult() {
      const r = state.lastReport || {};
      const stats = r.stats || {};
      const locked = r.awakening_locked;
      showStage();
      stage.innerHTML =
        '<p class="eyebrow">' + (locked ? "아직 이어가도 돼요" : "충분히 모았어요") + "</p>" +
        "<h2>지금 내 상태 · 가벼운 리포트</h2>" +
        '<div class="persona">' +
          "<h3>" + (r.title || "아직 비어 있어요") + "</h3>" +
          "<p>" + (r.awakening_quote || "카드를 조금 더 만져 보시면 그림이 또렷해져요.") + "</p>" +
        "</div>" +
        renderLiveBars(r) +
        '<div class="stat-grid">' +
          Object.keys(stats).map((k) =>
            '<div class="stat"><b>' + stats[k] + "</b><span>" + k + "</span></div>"
          ).join("") +
        "</div>" +
        '<div class="actions">' +
          '<a class="btn btn-primary" href="/chat#status" style="display:inline-block;text-decoration:none;">내 상태 한눈에</a>' +
          '<a class="btn btn-ghost" href="/chat#mind-network" style="display:inline-block;text-decoration:none;">3D 도면</a>' +
          '<button class="btn btn-ghost" id="backDeck">카드장</button>' +
          '<button class="btn btn-ghost" id="again">다시 하기</button>' +
        "</div>";
      document.getElementById("again").onclick = () => {
        document.getElementById("resetBtn").click();
      };
      document.getElementById("backDeck").onclick = showDeck;
      updateProgress(r);
    }

    document.getElementById("autoNextBtn").onclick = () => {
      const next = PROPS.find((p) => !state.done.has(p.id));
      if (!next) renderResult();
      else openProp(next);
    };
    document.getElementById("resetBtn").onclick = () => {
      state.done = new Set();
      state.index = 0;
      state.lastReport = null;
      state.turn = 0;
      state.activeId = null;
      sessionStorage.removeItem(SESS_KEY);
      sessionStorage.setItem("stealth_force_reset", "1");
      updateProgress(null);
      showDeck();
    };
    resultBtn.onclick = () => {
      if (state.done.size) renderResult();
    };

    async function hydrateDone() {
      try {
        const res = await fetch("/api/v1/users/" + encodeURIComponent(uid()) + "/stealth-unconscious");
        if (!res.ok) return;
        const data = await res.json();
        const latest = data.latest || {};
        const snap = latest.snapshot || latest;
        const ingested = snap.ingestedProps || snap.ingested_props || [];
        ingested.forEach((p) => state.done.add(p));
        if (latest.title || data.title) {
          state.lastReport = {
            title: latest.title || data.title,
            awakening_quote: latest.awakeningQuote || latest.awakening_quote,
            assessment_status: data.assessment_status || latest.assessmentStatus,
            awakening_locked: data.awakening_locked,
            clinical_profile: snap.clinicalProfile || latest.clinicalProfile,
            stats: latest.stats || snap.stats || {},
            progress: {
              assessmentStatus: data.assessment_status || latest.assessmentStatus,
              requiredForFinal: 8,
            },
          };
        }
      } catch (_) {}
      updateProgress(state.lastReport);
      renderDeck();
    }

    updateProgress(null);
    renderDeck();
    hydrateDone();
  })();
  </script>
</body>
</html>
