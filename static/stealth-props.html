<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1412" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="11종 마술 소품으로 무의식 지표를 매핑하는 스텔스 게임" />
  <title>마음쉼터 · 11종 소품 무의식 매핑</title>
  <link rel="stylesheet" href="/static/css/embed.css" />
  <script src="/static/js/embed-bridge.js"></script>
  <style>
    :root {
      --bg0: #0c1412;
      --bg1: #15221c;
      --ink: #e8f0ea;
      --muted: #8aa396;
      --gold: #c9a227;
      --emerald: #2dd4a8;
      --line: rgba(201, 162, 39, 0.28);
      --surface: rgba(21, 34, 28, 0.92);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(45, 212, 168, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(201, 162, 39, 0.12), transparent),
        linear-gradient(165deg, var(--bg0), var(--bg1));
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      background: rgba(8, 14, 12, 0.7); backdrop-filter: blur(8px);
    }
    .top h1 {
      margin: 0; flex: 1; font-size: 1rem; font-weight: 700;
      letter-spacing: 0.02em;
    }
    .top a, .top button {
      color: var(--gold); background: transparent; border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px; text-decoration: none; font-size: 0.78rem;
      cursor: pointer;
    }
    .progress-wrap { padding: 10px 16px; border-bottom: 1px solid var(--line); }
    .bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--emerald), var(--gold)); transition: width .35s; }
    .progress-meta { margin-top: 6px; font-size: 0.72rem; color: var(--muted); display: flex; justify-content: space-between; }
    main { flex: 1; max-width: 560px; margin: 0 auto; width: 100%; padding: 18px 16px 100px; }
    .stage {
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
      padding: 18px; min-height: 360px;
    }
    .eyebrow { color: var(--gold); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 8px; }
    .stage h2 { margin: 0 0 8px; font-size: 1.25rem; line-height: 1.35; }
    .stage p { margin: 0 0 14px; color: var(--muted); font-size: 0.88rem; line-height: 1.55; }
    .play-area {
      border: 1px dashed rgba(45, 212, 168, 0.35); border-radius: 14px;
      background: rgba(0,0,0,0.25); min-height: 160px; padding: 14px;
      position: relative; overflow: hidden; touch-action: none;
    }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 10px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .btn {
      border: none; border-radius: 12px; padding: 12px 16px; font-weight: 700;
      cursor: pointer; font-size: 0.85rem;
    }
    .btn-primary { background: linear-gradient(135deg, var(--emerald), #1aa882); color: #062018; }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .target {
      width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--emerald));
      position: absolute; left: 40%; top: 40%;
      box-shadow: 0 0 24px rgba(45,212,168,0.45); cursor: pointer;
    }
    .decoy {
      width: 36px; height: 36px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #aaa, #555);
      position: absolute; opacity: 0.55; cursor: pointer;
    }
    input[type=range] { width: 100%; accent-color: var(--gold); }
    .stat-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px;
    }
    .stat {
      background: rgba(0,0,0,0.28); border-radius: 12px; padding: 10px 12px;
      border: 1px solid var(--line);
    }
    .stat b { display: block; font-size: 1.1rem; color: var(--gold); }
    .stat span { font-size: 0.68rem; color: var(--muted); }
    .persona {
      margin-top: 14px; padding: 14px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(45,212,168,0.12), rgba(201,162,39,0.12));
      border: 1px solid var(--line);
    }
    .persona h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .disclaimer {
      margin-top: 16px; font-size: 0.72rem; color: var(--muted); line-height: 1.45;
      border-top: 1px solid var(--line); padding-top: 12px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .chip {
      font-size: 0.65rem; padding: 4px 8px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted);
    }
    .chip.done { color: var(--emerald); border-color: rgba(45,212,168,0.5); }
  </style>
</head>
<body>
  <header class="top">
    <a href="/chat">← 대화</a>
    <h1>11종 소품 · 스텔스 무의식 매핑</h1>
    <a href="/chat#mind-network">3D 도면</a>
  </header>
  <div class="progress-wrap">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="progress-meta">
      <span id="progressLabel">0 / 11</span>
      <span id="statusLabel">잠정 (8개 이상 시 각성 확정)</span>
    </div>
  </div>
  <main>
    <section class="stage" id="stage"></section>
    <p class="disclaimer">본 결과는 비진단 웰니스 참고 지표이며 의료 진단을 대체하지 않습니다. 소품 상호작용의 행동 프록시를 CHC·임상 스펙트럼 참고값으로 환산합니다.</p>
  </main>

  <script>
  (function () {
    const USER_KEY = "maum_user_id";
    const SESS_KEY = "stealth_prop_session";
    function uid() {
      let id = localStorage.getItem(USER_KEY);
      if (!id) {
        id = "su-" + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(USER_KEY, id);
      }
      return id;
    }
    function sid() {
      let id = sessionStorage.getItem(SESS_KEY);
      if (!id) {
        id = "sps-" + Date.now().toString(36);
        sessionStorage.setItem(SESS_KEY, id);
      }
      return id;
    }

    const PROPS = [
      { id: "RAIN_DROP", title: "물방울", cue: "빗방울 스트로보에 맞춰 점을 따라가세요.", kind: "chase" },
      { id: "WATER_TANK", title: "수조 탈출", cue: "신호가 뜨면 즉시 탈출 버튼을 누르세요.", kind: "qte" },
      { id: "CARD_STEALTH", title: "레이저 카드", cue: "레이저 격자 사이로 카드를 미끄러뜨리세요.", kind: "slider" },
      { id: "CHAMBER_BOX", title: "차원 상자", cue: "패턴을 반복하지 말고 새 순서로 상자를 여세요.", kind: "sequence" },
      { id: "MIRROR_SHADOW", title: "가짜 잔상", cue: "잔상을 쫓지 말고 가만히 관조하세요.", kind: "idle" },
      { id: "ROULETTE_DIAL", title: "미스디렉션 루렛", cue: "미끼를 누르지 말고 진짜 눈을 고르세요.", kind: "bait" },
      { id: "PERSONA_MASK", title: "페르소나 마스크", cue: "미세한 표정이 다른 마스크를 고르세요.", kind: "mask" },
      { id: "SLEIGHT_PALMING", title: "손놀림", cue: "일정한 압력으로 원을 그리세요.", kind: "draw" },
      { id: "MENTAL_PRIMING", title: "멘탈 프라이밍", cue: "암시에 끌리지 말고 스스로 고르세요.", kind: "prime" },
      { id: "HOLOGRAM_REALITY", title: "홀로그램", cue: "허상을 쫓지 말고 실체만 터치하세요.", kind: "holo" },
      { id: "INTERPERSONAL_SYNC", title: "인터랙션 동기화", cue: "상대 박자에 맞춰 탭하세요.", kind: "sync" },
    ];

    const state = {
      index: 0,
      done: new Set(),
      lastReport: null,
      turn: 0,
    };

    const stage = document.getElementById("stage");
    const fill = document.getElementById("fill");
    const progressLabel = document.getElementById("progressLabel");
    const statusLabel = document.getElementById("statusLabel");

    function updateProgress(report) {
      const n = state.done.size;
      fill.style.width = (n / 11 * 100) + "%";
      progressLabel.textContent = n + " / 11";
      if (report && report.progress) {
        const p = report.progress;
        const st = p.assessmentStatus === "final" ? "각성 확정" : "잠정";
        statusLabel.textContent = st + " · 확정에 " + (p.requiredForFinal || 8) + "개 필요";
      }
    }

    async function ingest(payload, opts) {
      opts = opts || {};
      state.turn += 1;
      const forceReset = sessionStorage.getItem("stealth_force_reset") === "1";
      if (forceReset) sessionStorage.removeItem("stealth_force_reset");
      const body = {
        payloads: [payload],
        session_id: sid(),
        turn_index: state.turn,
        source: "prop_game",
        persist: true,
        resume_last: !(opts.reset || forceReset),
        reset: !!(opts.reset || forceReset),
      };
      const res = await fetch("/api/v1/users/" + encodeURIComponent(uid()) + "/stealth-unconscious/ingest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error("ingest failed " + res.status);
      const data = await res.json();
      state.lastReport = data;
      state.done.add(payload.prop);
      updateProgress(data);
      return data;
    }

    function ms() { return Date.now(); }

    function renderIntro() {
      stage.innerHTML =
        '<p class="eyebrow">Now You See Me · Clinical IDE</p>' +
        "<h2>11개의 마술 소품으로<br/>무의식 벡터를 읽습니다</h2>" +
        "<p>각 소품은 행동·타이밍·시선 프록시를 남깁니다. 8개 이상 완료하면 호스멘 페르소나가 확정되고, 결과는 임상의 3D 미래 도면에 연결됩니다.</p>" +
        '<div class="chips" id="chipRow"></div>' +
        '<div class="actions"><button class="btn btn-primary" id="startBtn">무대 열기</button>' +
        '<button class="btn btn-ghost" id="resetBtn">처음부터</button></div>';
      const row = document.getElementById("chipRow");
      PROPS.forEach((p) => {
        const c = document.createElement("span");
        c.className = "chip" + (state.done.has(p.id) ? " done" : "");
        c.textContent = p.title;
        row.appendChild(c);
      });
      document.getElementById("startBtn").onclick = () => {
        state.index = 0;
        while (state.index < PROPS.length && state.done.has(PROPS[state.index].id)) state.index += 1;
        if (state.index >= PROPS.length) renderResult();
        else renderProp(PROPS[state.index]);
      };
      document.getElementById("resetBtn").onclick = () => {
        state.done = new Set();
        state.index = 0;
        state.lastReport = null;
        state.turn = 0;
        sessionStorage.removeItem(SESS_KEY);
        // 다음 ingest 때 reset:true 로 서버 집계를 비움
        sessionStorage.setItem("stealth_force_reset", "1");
        updateProgress(null);
        renderIntro();
      };
    }

    function nextAfter(propId) {
      state.done.add(propId);
      state.index += 1;
      if (state.index >= PROPS.length) renderResult();
      else renderProp(PROPS[state.index]);
    }

    function renderProp(prop) {
      stage.innerHTML =
        '<p class="eyebrow">PROP ' + (state.index + 1) + " / 11 · " + prop.id + "</p>" +
        "<h2>" + prop.title + "</h2>" +
        "<p>" + prop.cue + "</p>" +
        '<div class="play-area" id="play"></div>' +
        '<p class="hint" id="hint">준비되면 시작하세요.</p>' +
        '<div class="actions"><button class="btn btn-primary" id="goBtn">시작</button>' +
        '<button class="btn btn-ghost" id="skipBtn">건너뛰기</button></div>';

      const play = document.getElementById("play");
      const hint = document.getElementById("hint");
      const goBtn = document.getElementById("goBtn");
      const skipBtn = document.getElementById("skipBtn");
      skipBtn.onclick = () => nextAfter(prop.id);

      const finish = async (payload) => {
        goBtn.disabled = true;
        skipBtn.disabled = true;
        hint.textContent = "지표 전송 중…";
        try {
          const report = await ingest(payload);
          hint.textContent = report.assessment_status === "final"
            ? "각성 확정 · 다음으로"
            : "잠정 기록됨 · 다음으로";
          setTimeout(() => nextAfter(prop.id), 450);
        } catch (e) {
          hint.textContent = "전송 실패. 다시 시도해 주세요.";
          goBtn.disabled = false;
          skipBtn.disabled = false;
        }
      };

      if (prop.kind === "chase") {
        goBtn.onclick = () => {
          hint.textContent = "움직이는 점을 누르세요.";
          const t = document.createElement("div");
          t.className = "target";
          play.appendChild(t);
          let hits = 0, misses = 0, sumDelta = 0;
          const move = () => {
            t.style.left = (10 + Math.random() * 70) + "%";
            t.style.top = (10 + Math.random() * 60) + "%";
          };
          move();
          const iv = setInterval(move, 700);
          const started = performance.now();
          t.onclick = (ev) => {
            hits += 1;
            const r = t.getBoundingClientRect();
            const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
            sumDelta += Math.hypot(ev.clientX - cx, ev.clientY - cy);
            if (hits >= 4) {
              clearInterval(iv);
              const avg = sumDelta / hits;
              finish({
                prop: prop.id, timestampMs: ms(),
                strobePrecisionDeltaPx: Math.min(20, avg / 4),
                tremorVector: { x: misses * 0.2, y: avg / 40 },
              });
            }
          };
          play.onclick = (ev) => { if (ev.target === play) misses += 1; };
        };
      } else if (prop.kind === "qte") {
        goBtn.onclick = () => {
          hint.textContent = "대기…";
          const delay = 600 + Math.random() * 1200;
          setTimeout(() => {
            hint.textContent = "지금!";
            const btn = document.createElement("button");
            btn.className = "btn btn-primary";
            btn.textContent = "탈출";
            btn.style.margin = "40px auto";
            btn.style.display = "block";
            play.appendChild(btn);
            const shown = performance.now();
            let stim = 0;
            play.onclick = (ev) => { if (ev.target === play) stim += 1; };
            btn.onclick = () => finish({
              prop: prop.id, timestampMs: ms(),
              qteLatencyMs: performance.now() - shown,
              panicStimmingCount: stim,
            });
          }, delay);
        };
      } else if (prop.kind === "slider") {
        play.innerHTML = '<label class="hint">궤적 정확도</label><input id="acc" type="range" min="0" max="100" value="70" />' +
          '<label class="hint">통과 속도 (낮을수록 빠름)</label><input id="lat" type="range" min="80" max="900" value="200" />';
        goBtn.textContent = "통과 확정";
        goBtn.onclick = () => finish({
          prop: prop.id, timestampMs: ms(),
          stealthPassLatencyMs: Number(document.getElementById("lat").value),
          trajectoryAccuracyRatio: Number(document.getElementById("acc").value) / 100,
        });
      } else if (prop.kind === "sequence") {
        const keys = ["A", "B", "C", "D"];
        let expected = keys.slice().sort(() => Math.random() - 0.5);
        let got = [];
        let repeats = 0;
        let last = "";
        play.innerHTML = keys.map((k) => '<button class="btn btn-ghost seq" data-k="' + k + '">' + k + "</button>").join(" ");
        const t0 = performance.now();
        goBtn.style.display = "none";
        hint.textContent = "순서: " + expected.join(" → ");
        play.querySelectorAll(".seq").forEach((b) => {
          b.onclick = () => {
            const k = b.getAttribute("data-k");
            if (k === last) repeats += 1;
            last = k;
            got.push(k);
            if (got.length === expected.length) {
              if (got.join() !== expected.join()) repeats += 2;
              finish({
                prop: prop.id, timestampMs: ms(),
                rigidPatternRepeatCount: repeats,
                dimensionReconstructTimeSec: (performance.now() - t0) / 1000,
              });
            }
          };
        });
      } else if (prop.kind === "idle") {
        goBtn.onclick = () => {
          hint.textContent = "잔상을 누르지 말고 3초간 관조…";
          let chasing = 0;
          const decoy = document.createElement("div");
          decoy.className = "decoy";
          decoy.style.left = "60%"; decoy.style.top = "30%";
          play.appendChild(decoy);
          decoy.onclick = () => { chasing += 1; };
          const t0 = performance.now();
          setTimeout(() => finish({
            prop: prop.id, timestampMs: ms(),
            illusionChasingClicks: chasing,
            idleAcceptanceDurationMs: performance.now() - t0,
          }), 3000);
        };
      } else if (prop.kind === "bait") {
        goBtn.onclick = () => {
          hint.textContent = "금색만 고르세요.";
          let bait = 0;
          for (let i = 0; i < 5; i++) {
            const d = document.createElement("div");
            d.className = i === 2 ? "target" : "decoy";
            d.style.left = (8 + i * 18) + "%";
            d.style.top = (30 + (i % 2) * 20) + "%";
            play.appendChild(d);
            d.onclick = () => {
              if (i !== 2) bait += 1;
              else finish({
                prop: prop.id, timestampMs: ms(),
                misdirectionBaitClicks: bait,
                entropyRandomnessIndex: Math.max(0.1, 1 - bait * 0.2),
              });
            };
          }
        };
      } else if (prop.kind === "mask") {
        const faces = ["🙂", "😐", "😉", "😌"];
        const truth = 2;
        play.innerHTML = faces.map((f, i) =>
          '<button class="btn btn-ghost mask" data-i="' + i + '" style="font-size:1.6rem">' + f + "</button>"
        ).join(" ");
        goBtn.style.display = "none";
        hint.textContent = "미세하게 다른 표정(윙크)을 고르세요.";
        const t0 = performance.now();
        play.querySelectorAll(".mask").forEach((b) => {
          b.onclick = () => {
            const i = Number(b.getAttribute("data-i"));
            finish({
              prop: prop.id, timestampMs: ms(),
              microExpressionScanLatencyMs: performance.now() - t0,
              maskMatchAccuracyRatio: i === truth ? 1 : 0.2,
            });
          };
        });
      } else if (prop.kind === "draw") {
        const canvas = document.createElement("canvas");
        canvas.width = 320; canvas.height = 140;
        canvas.style.width = "100%";
        play.appendChild(canvas);
        const ctx = canvas.getContext("2d");
        ctx.strokeStyle = "#2dd4a8"; ctx.lineWidth = 2;
        let drawing = false, pts = [], pressures = [];
        const pos = (e) => {
          const r = canvas.getBoundingClientRect();
          const x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * (canvas.width / r.width);
          const y = ((e.touches ? e.touches[0].clientY : e.clientY) - r.top) * (canvas.height / r.height);
          return { x, y };
        };
        const start = (e) => { drawing = true; pts = []; pressures = []; const p = pos(e); pts.push(p); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
        const move = (e) => {
          if (!drawing) return;
          const p = pos(e); pts.push(p);
          pressures.push(e.pressure || 0.5);
          ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault();
        };
        const end = () => { drawing = false; };
        canvas.addEventListener("mousedown", start); canvas.addEventListener("mousemove", move);
        canvas.addEventListener("mouseup", end);
        canvas.addEventListener("touchstart", start, { passive: false });
        canvas.addEventListener("touchmove", move, { passive: false });
        canvas.addEventListener("touchend", end);
        goBtn.textContent = "궤적 제출";
        goBtn.onclick = () => {
          let curv = 0.5;
          if (pts.length > 3) {
            let sum = 0;
            for (let i = 2; i < pts.length; i++) {
              const a = pts[i - 2], b = pts[i - 1], c = pts[i];
              const ang = Math.abs(Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(b.y - a.y, b.x - a.x));
              sum += ang;
            }
            curv = Math.min(1, sum / pts.length);
          }
          const mean = pressures.length ? pressures.reduce((a, b) => a + b, 0) / pressures.length : 0.5;
          const inst = pressures.length
            ? Math.sqrt(pressures.reduce((s, p) => s + (p - mean) ** 2, 0) / pressures.length)
            : 0.4;
          finish({
            prop: prop.id, timestampMs: ms(),
            gestureCurvatureVariance: curv,
            touchPressureInstability: Math.min(1, inst * 2),
          });
        };
      } else if (prop.kind === "prime") {
        play.innerHTML = '<p class="hint">암시: 「대부분 사람들은 왼쪽을 고릅니다.」</p>' +
          '<button class="btn btn-ghost" id="left">왼쪽</button> <button class="btn btn-ghost" id="right">오른쪽</button>';
        goBtn.style.display = "none";
        const t0 = performance.now();
        const pick = (side) => finish({
          prop: prop.id, timestampMs: ms(),
          primingBiasAcceptanceRatio: side === "left" ? 0.85 : 0.2,
          decisionHesitationMs: performance.now() - t0,
        });
        document.getElementById("left").onclick = () => pick("left");
        document.getElementById("right").onclick = () => pick("right");
      } else if (prop.kind === "holo") {
        goBtn.onclick = () => {
          hint.textContent = "에메랄드 실체만 터치";
          let chase = 0;
          for (let i = 0; i < 4; i++) {
            const d = document.createElement("div");
            const real = i === 1;
            d.className = real ? "target" : "decoy";
            d.style.left = (15 + i * 18) + "%";
            d.style.top = "40%";
            play.appendChild(d);
            d.onclick = () => {
              if (!real) { chase += 1; return; }
              finish({
                prop: prop.id, timestampMs: ms(),
                distortionIllusionChasingClicks: chase,
                perceptualRealityTestingScore: Math.max(10, 95 - chase * 12),
              });
            };
          }
        };
      } else if (prop.kind === "sync") {
        goBtn.onclick = () => {
          hint.textContent = "박자에 맞춰 탭 (3회)";
          let beat = 0, deltas = [], last = performance.now();
          const iv = setInterval(() => {
            play.style.boxShadow = "inset 0 0 40px rgba(201,162,39,0.35)";
            setTimeout(() => { play.style.boxShadow = "none"; }, 120);
            last = performance.now();
          }, 650);
          play.onclick = () => {
            deltas.push(Math.abs(performance.now() - last));
            beat += 1;
            if (beat >= 3) {
              clearInterval(iv);
              const avg = deltas.reduce((a, b) => a + b, 0) / deltas.length;
              finish({
                prop: prop.id, timestampMs: ms(),
                interpersonalSyncDeltaMs: avg,
                socialAdaptabilityRatio: Math.max(0.2, Math.min(1, 1 - avg / 400)),
              });
            }
          };
        };
      }
    }

    function renderResult() {
      const r = state.lastReport || {};
      const stats = r.stats || {};
      const locked = r.awakening_locked;
      stage.innerHTML =
        '<p class="eyebrow">' + (locked ? "PROVISIONAL" : "AWAKENING FINAL") + "</p>" +
        "<h2>세션 리포트</h2>" +
        '<div class="persona">' +
          "<h3>" + (r.title || "페르소나 미정") + "</h3>" +
          "<p>" + (r.awakening_quote || "소품을 더 진행해 주세요.") + "</p>" +
        "</div>" +
        '<div class="stat-grid">' +
          Object.keys(stats).map((k) =>
            '<div class="stat"><b>' + stats[k] + "</b><span>" + k + "</span></div>"
          ).join("") +
        "</div>" +
        '<div class="actions">' +
          '<a class="btn btn-primary" href="/chat#mind-network" style="display:inline-block;text-decoration:none;">임상의 3D 미래 도면 열기</a>' +
          '<button class="btn btn-ghost" id="again">다시 하기</button>' +
        "</div>" +
        (r.clinical_ide_output
          ? '<pre style="white-space:pre-wrap;font-size:0.65rem;color:var(--muted);margin-top:14px;max-height:220px;overflow:auto;">' +
            String(r.clinical_ide_output).replace(/</g, "&lt;") + "</pre>"
          : "");
      document.getElementById("again").onclick = () => {
        state.index = 0;
        renderIntro();
      };
      updateProgress(r);
    }

    updateProgress(null);
    renderIntro();
  })();
  </script>
</body>
</html>
